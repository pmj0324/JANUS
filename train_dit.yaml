# Training config for DiT diffusion model (train.py)
# Usage: python train.py -c train_dit.yaml

model:
  type: dit
  options:
    d_model: 256
    nhead: 8
    depth: 6
    mlp_ratio: 4.0
    dropout: 0.0
    label_dim: 6

diffusion:
  schedule:
    type: sigmoid
    timesteps: 1000
    beta_start: 0.0001
    beta_end: 0.02

training:
  nepochs: 20
  bsz: 256
  lr: 0.0003

data:
  loader: h5
  h5_path: ./GENESIS-data/22644_0921_time_shift.h5
  bsz: 256
  shuffle: true
  num_workers: 0
  angle_conversion: false
  pin_memory: false

path: ./output/
device: cuda
print_every: 50
compile_model: false
